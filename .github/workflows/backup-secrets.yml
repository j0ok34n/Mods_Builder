name: Backup Actions secrets to Google Drive

on:
  workflow_dispatch:

permissions: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone

      - name: Upload secrets backup
        shell: bash
        env:
          BACKUP_SECRETS_JSON: ${{ toJson(secrets) }}
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          GDRIVE_DESTINATION: ${{ secrets.GDRIVE_DESTINATION }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$RCLONE_CONFIG_BASE64" && -n "$GDRIVE_DESTINATION" ]] || {
            echo 'RCLONE_CONFIG_BASE64 and GDRIVE_DESTINATION are required'
            exit 1
          }

          backup_dir="$(mktemp -d "$RUNNER_TEMP/secrets-backup.XXXXXXXX")"
          chmod 700 "$backup_dir"
          trap 'rm -rf "$backup_dir"' EXIT
          config="$backup_dir/rclone.conf"
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > "$config"
          chmod 600 "$config"

          repo_name="${GITHUB_REPOSITORY#*/}"
          filename="${repo_name}-actions-secrets-${GITHUB_RUN_ID}.json"
          backup_file="$backup_dir/$filename"

          BACKUP_FILE="$backup_file" python3 -c '
          import json, os, sys
          secrets = json.loads(os.environ["BACKUP_SECRETS_JSON"])
          for name in list(secrets):
              if name.upper() == "GITHUB_TOKEN":
                  del secrets[name]
          if not secrets:
              sys.exit("No persistent Actions secrets are available to this job")
          document = {"repository": os.environ["GITHUB_REPOSITORY"], "secrets": secrets}
          with open(os.environ["BACKUP_FILE"], "w", encoding="utf-8") as output:
              json.dump(document, output, ensure_ascii=False, indent=2, sort_keys=True)
              output.write("\n")
          '

          remote_file="${GDRIVE_DESTINATION%/}/Actions_Secrets_Backup/$filename"
          rclone --config "$config" copyto "$backup_file" "$remote_file"
          remote_size="$(rclone --config "$config" lsjson "$remote_file" --stat | python3 -c 'import json,sys; print(json.load(sys.stdin)["Size"])')"
          local_size="$(stat -c '%s' "$backup_file")"
          [[ "$remote_size" == "$local_size" ]] || {
            echo 'Uploaded backup size does not match the local file'
            exit 1
          }

          {
            echo '## Actions secrets backup'
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Google Drive path: $remote_file"
            echo "- Size: $local_size bytes"
            echo 'This JSON file contains plaintext secret values. Keep it private.'
          } >> "$GITHUB_STEP_SUMMARY"
